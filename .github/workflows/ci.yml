name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test
      - run: cargo clippy -- -D warnings

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release
      # Console variant: prints errors/--version to the terminal. For troubleshooting only.
      - run: cargo build --release --features console --target-dir target-console
      - name: Smoke test (the exe must at least start)
        shell: pwsh
        run: |
          $out = & .\target-console\release\gotop-blackbox.exe --version
          "exit=$LASTEXITCODE out=$out"
          if ($LASTEXITCODE -ne 0 -or "$out" -notmatch '\d+\.\d+\.\d+') { throw "console exe did not start (exit=$LASTEXITCODE, hex 0x{0:X})" -f $LASTEXITCODE }
          # The GUI exe must carry the Common Controls v6 manifest.
          foreach ($f in 'target\release\gotop-blackbox.exe','target-console\release\gotop-blackbox.exe') {
            $bytes = [IO.File]::ReadAllBytes($f)
            $text = [Text.Encoding]::ASCII.GetString($bytes)
            if ($text -notmatch 'Microsoft\.Windows\.Common-Controls') { throw "$f has no Common Controls manifest" }
          }
      - name: GUI self-test (window must build, theme and icon must not crash)
        shell: pwsh
        run: |
          & .\target-console\release\gotop-blackbox.exe --gui-selftest --no-screenshot
          "exit=$LASTEXITCODE"
          Get-Content "$env:TEMP\gotop-blackbox.log" -Tail 8
          if ($LASTEXITCODE -ne 0) { throw "GUI self-test failed (exit=$LASTEXITCODE)" }
      - name: Bundle self-test (wevtutil must accept the event-log query)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'bb-selftest'
          Set-Content -Path "$dir.toml" -Value @("share_path = ''", "fallback_dir = '$dir'", "logs = []")
          & .\target-console\release\gotop-blackbox.exe --config "$dir.toml" --headless --no-screenshot
          $rep = Get-ChildItem $dir -Directory | Select-Object -First 1
          $j = Get-Content (Join-Path $rep.FullName 'report.json') -Raw | ConvertFrom-Json
          "warnings: $($j.warnings -join ' | ')"
          Get-ChildItem $rep.FullName | Select-Object Name, Length
          if ($j.warnings -match 'event log') { throw "event log collection failed" }
          if (-not (Test-Path (Join-Path $rep.FullName 'events-application.txt'))) { throw "events-application.txt missing" }
      - name: Stage artifact
        shell: bash
        run: |
          mkdir dist
          cp target/release/gotop-blackbox.exe dist/
          cp target-console/release/gotop-blackbox.exe dist/gotop-blackbox-console.exe
          cp gotop-blackbox.example.toml dist/
          (cd dist && sha256sum *.exe > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: gotop-blackbox-windows
          path: dist/
